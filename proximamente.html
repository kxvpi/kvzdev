<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Próximamente | kavaxpi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--obsidian:#000;--graphite:#0e0e0e;--carbon:#1d1d1f;--gradient-carbon:linear-gradient(#1d1d1f,#000 288px);--steel:#333336;--slate:#6e6e73;--ash:#86868b;--porcelain:#f5f5f7;--blue:#0071e3;--link:#2997ff;--cobalt:#0066cc;--r-card:28px;--font:'SF Pro Display','SF Pro Text','Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:60px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--obsidian);color:var(--porcelain);font:400 17px/1.47 var(--font);letter-spacing:-.374px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:var(--link);text-decoration:none}h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{width:min(1180px,calc(100% - 48px));margin:0 auto}
.nav{position:sticky;top:0;z-index:50;height:44px;background:rgba(0,0,0,.8);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px)}
.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}
.brand{color:var(--porcelain);font-weight:600;font-size:14px;letter-spacing:-.224px}
.links{display:flex;gap:28px}.links a{color:rgba(255,255,255,.8);font-size:12px;letter-spacing:-.12px;line-height:1.33}.links a:hover{color:#fff}
.menu{display:none;background:none;border:0;color:var(--porcelain);font-size:16px;cursor:pointer;padding:8px}
.hero{text-align:center;padding:96px 0 64px}
.hero .name{font-size:32px;font-weight:600;line-height:1.13;letter-spacing:.128px}
.hero h1{font-size:clamp(40px,9vw,80px);font-weight:600;line-height:1.05;letter-spacing:-1.2px;margin:12px auto 20px;max-width:14ch}
.hero p.lead{max-width:640px;margin:0 auto 32px;color:var(--ash);font-size:21px;line-height:1.38;letter-spacing:.231px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:170px;border:1px solid transparent;font:inherit;font-size:17px;font-weight:400;letter-spacing:-.374px;line-height:1.1;cursor:pointer;transition:background .2s,color .2s}
.pill.blue{background:var(--blue);color:#fff}.pill.blue:hover{background:#0077ed}
.pill.line{border-color:var(--slate);color:var(--porcelain);background:transparent;border-radius:9999px}.pill.line:hover{background:rgba(255,255,255,.08)}
.pill.sm{font-size:14px;padding:8px 18px}.pill.off{color:var(--ash);border-color:var(--steel)}
.frame{position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--carbon)}
.frame img{width:100%;height:100%;object-fit:cover}
.cap{position:absolute;left:20px;bottom:20px;padding:8px 16px;border-radius:9999px;background:rgba(51,51,54,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:14px;letter-spacing:-.224px}
.hero-frame{aspect-ratio:2/1;margin-top:8px}
.section{padding:90px 0}.band{background:var(--gradient-carbon)}
.head{text-align:center;margin:0 auto 48px;max-width:720px}
.head h2{font-size:clamp(32px,5vw,56px);font-weight:600;line-height:1.07;letter-spacing:-.84px}
.head p{margin-top:16px;color:var(--ash);font-size:19px;line-height:1.4;letter-spacing:.228px}
.panel{background:var(--carbon);border-radius:var(--r-card);padding:24px}
.grid{display:grid;gap:24px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.panel .grid{gap:16px}
.tile{background:var(--obsidian);border-radius:var(--r-card);padding:28px;display:flex;flex-direction:column;gap:12px}
.tile.carbon{background:var(--carbon)}
.tile i{font-size:22px;color:var(--porcelain);margin-bottom:8px}
.tile h3{font-size:19px;font-weight:600;line-height:1.21;letter-spacing:.228px}
.tile p{font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ash)}
.tile .pill{margin-top:auto;align-self:flex-start}.tile p+.pill{margin-top:12px}
.tile .tile-icon{width:40px;height:40px;object-fit:contain;margin-bottom:8px}
.stat{align-items:center;text-align:center;padding:36px 28px}
.stat strong{font-size:28px;font-weight:600;line-height:1;letter-spacing:.196px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.tag{padding:4px 12px;border:1px solid var(--steel);border-radius:9999px;font-size:12px;line-height:1.33;letter-spacing:-.12px;color:var(--porcelain)}
.tag.dim{color:var(--ash)}
.rows{border-top:1px solid var(--steel)}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--steel)}
.logo{width:56px;height:56px;border-radius:14px;background:var(--carbon);object-fit:contain;overflow:hidden}
.row h3{font-size:19px;font-weight:600;letter-spacing:.228px;line-height:1.21}
.row p{font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ash);max-width:62ch;margin-top:4px}
.role{padding:4px 12px;border:1px solid var(--slate);border-radius:9999px;font-size:12px;font-weight:600;letter-spacing:-.12px;white-space:nowrap}
.works{display:grid;grid-template-columns:1fr 1fr;gap:24px}.works .frame{aspect-ratio:16/9}.works .wide{grid-column:1/-1;aspect-ratio:2/1}
.contact{background:#fff;color:var(--carbon);border-radius:var(--r-card);padding:64px 32px;text-align:center}
.contact h2{font-size:clamp(32px,5vw,48px);font-weight:600;line-height:1.1;letter-spacing:-.24px;max-width:18ch;margin:0 auto 16px}
.contact p{color:#6e6e73;max-width:560px;margin:0 auto 32px;font-size:19px;line-height:1.4}
.contact .pill.line{color:var(--carbon);border-color:#d2d2d7}.contact .pill.line:hover{background:#f5f5f7}
footer{padding:0 0 48px;color:var(--ash);font-size:12px;letter-spacing:-.12px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);padding:12px 20px;border-radius:9999px;background:rgba(66,66,69,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){
.wrap{width:calc(100% - 32px)}.section{padding:64px 0}.hero{padding:64px 0 40px}
.menu{display:block}.links{display:none;position:absolute;top:44px;left:0;right:0;flex-direction:column;gap:0;background:#161617;padding:8px 16px 16px;border-radius:0 0 20px 20px}
.links.open{display:flex}.links a{font-size:17px;padding:12px 0;border-bottom:1px solid var(--steel)}
.g3,.g2,.works{grid-template-columns:1fr}.works .wide{aspect-ratio:16/9}.hero-frame{aspect-ratio:4/3}
.panel{padding:12px}.tile{padding:24px}.row{grid-template-columns:48px 1fr}.logo{width:48px;height:48px}.role{grid-column:2;justify-self:start}
.pill{width:100%;justify-content:center}.tile .pill,.row .pill{width:auto}.contact{padding:48px 20px}.hero p.lead{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

:root{--bg:#18181a;--hi:#2a2a2d;--lo:#09090a;--ease:cubic-bezier(.23,1,.32,1);--up:8px 8px 20px var(--lo),-8px -8px 20px var(--hi);--up-s:5px 5px 12px var(--lo),-5px -5px 12px var(--hi);--in:inset 6px 6px 14px var(--lo),inset -6px -6px 14px var(--hi);--in-s:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}
body{background:var(--bg)}.band{background:none}
.nav{background:rgba(24,24,26,.82);box-shadow:0 1px 0 rgba(255,255,255,.04)}
.panel,.tile,.tile.carbon,.frame,.row,.contact{background:var(--bg);color:var(--porcelain)}
.panel{box-shadow:var(--in)}.tile,.frame,.row,.contact{box-shadow:var(--up)}.panel .tile{box-shadow:var(--up-s)}
.contact p{color:var(--ash)}.contact .pill.line{color:var(--porcelain)}
.tile i,.tile .tile-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;box-shadow:var(--in);font-size:18px}
.tile .tile-icon{padding:11px}
.tag,.role{border:0;box-shadow:var(--in-s);padding:5px 12px}
.rows{border:0}.row{border:0;margin-bottom:16px;padding:16px 20px;border-radius:28px}
.logo{background:var(--bg);box-shadow:var(--in);padding:6px;border-radius:16px}
.pill{transition:transform .16s var(--ease),box-shadow .25s var(--ease),background .2s}
.pill.line,.pill.line:hover{border:0;background:var(--bg);box-shadow:var(--up-s)}
.pill.blue{box-shadow:var(--up-s),inset 0 1px 0 rgba(255,255,255,.22)}
.pill:active{transform:scale(.97)}.pill.line:active{box-shadow:var(--in-s)}
.cap{background:rgba(24,24,26,.72)}
.bar{position:fixed;top:0;left:0;right:0;height:2px;background:var(--blue);transform:scaleX(0);transform-origin:left;z-index:60;pointer-events:none}
.links a.on{color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.js .rv{opacity:0}.js .rv.in{opacity:1;animation:rise .8s var(--ease) backwards;animation-delay:calc(var(--i,0)*80ms)}
.js .frame img{transform:scale(1.1);transition:transform 1.5s var(--ease)}.js .frame.in img{transform:none}
@media(hover:hover) and (pointer:fine){.tile,.row{transition:translate .3s var(--ease),box-shadow .3s var(--ease)}.tile:hover,.row:hover{translate:0 -4px}}
@media(prefers-reduced-motion:reduce){.js .rv{opacity:1}.js .rv.in{animation:none}.js .frame img{transform:none;transition:none}.tile,.row{transition:none}}

@media(min-width:721px){.section{padding:120px 0}.panel{padding:32px}.panel .grid{gap:24px}.tile{padding:40px;min-height:300px;gap:16px}.stat{min-height:0;padding:48px 28px}.row{padding:24px 28px;grid-template-columns:72px 1fr auto;gap:24px}.logo{width:72px;height:72px}}
.head{margin-bottom:clamp(40px,6vw,72px);max-width:840px}.head h2{font-size:clamp(34px,6vw,68px);letter-spacing:-1.2px}.head p{font-size:clamp(17px,2vw,21px)}
.tile{position:relative}.tile h3{font-size:clamp(20px,2.2vw,26px)}.tile p{font-size:clamp(14px,1.4vw,16px);line-height:1.55}
.tile i,.tile .tile-icon{width:56px;height:56px;font-size:22px;border-radius:18px;margin-bottom:12px}.tile .tile-icon{padding:13px}
.stat strong{font-size:clamp(34px,5vw,56px);letter-spacing:-.5px}.tag{font-size:13px;padding:6px 14px}.row h3{font-size:clamp(19px,2.2vw,24px)}.row p{font-size:15px}.role{font-size:13px;padding:7px 16px}
.tile::after,.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(280px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.08),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.tile:hover::after,.frame:hover::after{opacity:1}
.pill{position:relative;overflow:hidden;translate:var(--mx,0) var(--my,0);transition:transform .16s var(--ease),translate .25s var(--ease),box-shadow .25s var(--ease),background .2s}
.pill.blue::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);translate:-120% 0;transition:translate .7s var(--ease)}.pill.blue:hover::before{translate:120% 0}
.pill i{transition:transform .3s var(--ease)}.pill:hover i{transform:scale(1.18) rotate(-8deg)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.25);transform:scale(0);animation:rip .6s var(--ease) forwards;pointer-events:none}@keyframes rip{to{transform:scale(1);opacity:0}}
.links a{position:relative}.links a::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.hero{position:relative}.hero .wrap{position:relative;z-index:1}
.orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none}.orbs i{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.16;background:var(--blue);animation:float 16s ease-in-out infinite alternate;will-change:transform}
.orbs i:nth-child(1){top:-140px;left:-140px}.orbs i:nth-child(2){bottom:8%;right:-180px;background:#7a5cff;animation-duration:21s;animation-delay:-6s}@keyframes float{to{transform:translate(90px,60px) scale(1.15)}}
.hero-frame img{height:118%;margin-top:-9%}
@keyframes word{from{opacity:0;transform:translateY(40px);filter:blur(8px)}}
.js .w{display:inline-block;animation:word .9s var(--ease) backwards;animation-delay:calc(.15s + var(--i)*80ms)}
.top{position:fixed;right:24px;bottom:24px;width:52px;height:52px;border:0;border-radius:50%;background:var(--bg);box-shadow:var(--up-s);color:var(--porcelain);display:grid;place-items:center;cursor:pointer;opacity:0;transform:translateY(16px) scale(.9);pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease),box-shadow .25s;z-index:70}
.top.show{opacity:1;transform:none;pointer-events:auto}.top:active{transform:scale(.94);box-shadow:var(--in-s)}
.top svg{position:absolute;inset:0;transform:rotate(-90deg)}.top circle{fill:none;stroke-width:2}.top .trk{stroke:rgba(255,255,255,.07)}.top .prg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:144.5;stroke-dashoffset:144.5}
.top i{transition:translate .3s var(--ease)}.top:hover i{translate:0 -3px}
.follower{position:fixed;left:0;top:0;z-index:90;pointer-events:none;opacity:0;transition:opacity .25s}.follower.on{opacity:1}
.fi{width:64px;height:64px;border-radius:50%;background:var(--bg);box-shadow:var(--up-s);display:grid;place-items:center;transition:transform .3s var(--ease)}.fi img{width:62%;height:62%;object-fit:contain;border-radius:10px}.follower.big .fi{transform:scale(1.3)}
@media(hover:hover) and (pointer:fine){.tile,.frame{transition:transform .25s var(--ease),translate .3s var(--ease),box-shadow .3s var(--ease)}.tile i,.logo{transition:transform .35s var(--ease)}.tile:hover i{transform:scale(1.1) rotate(-4deg)}.row:hover .logo{transform:scale(1.08) rotate(-4deg)}}
@media(max-width:720px){.links a::after{display:none}.top{right:16px;bottom:16px}.orbs i{width:320px;height:320px}}
@media(prefers-reduced-motion:reduce){.orbs i,.js .w,.rip{animation:none}.pill{translate:none}}

.soon{text-align:center;max-width:560px}.soon h1{font-size:clamp(40px,9vw,80px);font-weight:600;line-height:1.05;letter-spacing:-1.2px;margin:12px 0 20px}
.soon p{color:var(--ash);font-size:19px;line-height:1.4;margin-bottom:32px}
